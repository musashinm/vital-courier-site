x-node: &node
  build: .
  volumes:
    - .:/app
    - node_modules:/app/node_modules
  environment:
    ASTRO_TELEMETRY_DISABLED: '1'
    NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    WRANGLER_SEND_METRICS: 'false'
  # Installs dependencies into the named volume whenever package-lock.json
  # differs from the last successful install, then runs the service's command.
  # The hash is written only after npm ci exits 0, so an interrupted install is
  # retried rather than trusted. flock on the node_modules mount point (which
  # npm ci can empty but not delete) stops web and preview from installing at
  # the same time; closing fd 9 releases it before the command starts.
  entrypoint:
    - sh
    - -c
    - |
      exec 9<node_modules || exit 1
      flock 9 || exit 1
      lock_hash=$$(sha256sum package-lock.json) || exit 1
      if [ "$$(cat node_modules/.npm-ci-lock-hash 2>/dev/null)" != "$$lock_hash" ]; then
        npm ci || exit 1
        printf '%s' "$$lock_hash" > node_modules/.npm-ci-lock-hash || exit 1
      fi
      exec 9<&-
      exec "$$@"
    - --

services:
  web:
    <<: *node
    ports:
      - '4321:4321'
    # --ignore-lock: Astro's .astro/dev.json lock is shared with the host
    # through the bind mount, and with no `ps` in the image Astro treats any
    # live PID in it as a running server, so a stale lock can block the start.
    # The cost: `astro dev stop`, `status` and `logs` can't see this server.
    command: npm run dev -- --host 0.0.0.0 --ignore-lock

  preview:
    <<: *node
    profiles: [preview]
    ports:
      - '8787:8787'
    command: sh -c 'npm run build && exec npm run preview -- --ip 0.0.0.0'

volumes:
  node_modules:
