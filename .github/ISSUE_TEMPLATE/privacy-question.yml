name: Privacy policy question
description: Ask about the Vital Courier privacy policy, or point out something wrong in it. / Pergunte sobre a política de privacidade ou aponte um erro nela.
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public.** Anyone can read them. Don't post health information or anything else private here. GitHub handles your account and profile data under its own [privacy statement](https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement).

        **Issues são públicas.** Qualquer pessoa pode ler. Não publique informações de saúde nem nada privado aqui. O GitHub trata os dados da sua conta e do seu perfil conforme a própria [declaração de privacidade](https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement).
  - type: dropdown
    id: policy-language
    attributes:
      label: Which version of the policy? / Qual versão da política?
      options:
        - English
        - Português (Brasil)
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question or correction / Sua pergunta ou correção
      description: Quote the section you mean, if there is one. / Cite a seção, se houver.
    validations:
      required: true
  - type: checkboxes
    id: nothing-private
    attributes:
      label: Before you submit / Antes de enviar
      options:
        - label: This issue has no health information or anything else private. / Esta issue não tem informações de saúde nem nada privado.
          required: true
