version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    ignore:
      # .nvmrc pins Node 24; a major bump needs it changed by hand.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    ignore:
      # .nvmrc pins Node 24; the types follow it, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
